# The standalone image's web server. It serves the console from the image and
# hands the server's own routes to the Technitium server named by TECHNITIUM_URL.
# entrypoint.sh checks that variable and writes upstream.conf, the one generated
# piece: the listen lines, the resolver and the $technitium_* variables.
#
# Everything nginx writes goes under /tmp, so the image runs under any user and
# with a read-only root filesystem.
pid /tmp/nginx.pid;
worker_processes 1;

# The error log quotes the failing request's line, query string included, and a
# request may carry token= there. So nothing below alert is written: the access
# log already says when and how a forwarded call failed.
error_log /dev/stderr alert;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    # $uri, never $request, $request_uri or $args: the query string may hold a
    # session token. $http_referer is left out for the same reason.
    log_format technitium '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time upstream=$upstream_status';
    access_log /dev/stdout technitium;

    large_client_header_buffers 4 32k;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # What a proxy in front of this container said, or else this hop's scheme.
    map $http_x_forwarded_proto $technitium_forwarded_proto {
        default $scheme;
        ~^https?$ $http_x_forwarded_proto;
    }

    server {
        include /tmp/technitium-console/upstream.conf;

        root /usr/share/technitium-console/www;
        index index.html;
        # A folder without its slash redirects: to the path alone, because this
        # container does not know the port it is published on.
        absolute_redirect off;

        # No fallback to one page: the build emits one real folder per route.
        # add_header lives only here, and not at server level, so the forwarded
        # routes do not inherit it. `always` keeps it on the 404s.
        location / {
            try_files $uri $uri/ =404;

            gzip on;
            gzip_vary on;
            gzip_min_length 1024;
            gzip_types text/css application/javascript application/json image/svg+xml text/plain;

            # The headers the server puts on its own static files
            # (DnsWebService.cs, UseStaticFiles).
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none';" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Cache-Control "no-cache" always;
        }

        # The console's calls, and the two legs of a single sign-on.
        location ~ ^/(api|sso)/ {
            # A variable, so the name is looked up per request and not once at
            # start: the server may come up after this container, or change address.
            proxy_pass $technitium_url;
            proxy_http_version 1.1;

            proxy_set_header Host $technitium_host;
            proxy_set_header Connection "";
            # One address each, not a chain: the server parses the header it
            # reads as a single IP.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $technitium_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            # Dropped, even if a client sends it: the server would mount a
            # PathBase from it, and the console is at the root here.
            proxy_set_header X-Forwarded-Prefix "";

            # The name to present over TLS. The certificate is not verified:
            # the server's default one is self-signed.
            proxy_ssl_server_name on;
            proxy_ssl_name $technitium_sni;
            proxy_ssl_verify off;

            # Backup restores, zone imports and app installs: no size limit,
            # nothing spooled to disk on the way, and time to finish.
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_buffering off;
            # Single sign-on's cookies do not fit nginx's default header space.
            proxy_buffer_size 32k;
            proxy_buffers 4 32k;
            proxy_connect_timeout 10s;
            proxy_send_timeout 1h;
            proxy_read_timeout 1h;
            send_timeout 1h;
            client_body_timeout 1h;

            # Only nginx's own failures: what the server answers passes through.
            error_page 502 504 @technitium_unreachable;
        }

        # The shape of the API's own errors, so the console can show the message.
        location @technitium_unreachable {
            default_type application/json;
            return 502 '{"status":"error","errorMessage":"This console cannot reach the Technitium DNS server. Check that the server is running and that TECHNITIUM_URL points at it."}';
        }
    }
}
