# Builds the console and attaches it to the release, because that tarball is
# what install.sh downloads. Without this there is nothing to install.
#
# npm (the dependencies' install scripts, the tests, the build) runs only in
# `tarball`, which can read the repo and nothing else. The job that can write
# to the repo, `release`, gets just the tarball and its checksum.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  tarball:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The same tarball the develop image is built from (develop-image.yml).
      - uses: ./.github/actions/console-tarball

      - uses: actions/upload-artifact@v7
        with:
          name: console-tarball
          path: |
            technitium-console.tar.gz
            technitium-console.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    needs: tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      latest: ${{ steps.floating.outputs.latest }}
      floating: ${{ steps.floating.outputs.floating }}
    steps:
      # For CHANGELOG.md and the tags; no npm here. The token is not left in
      # .git/config: only the release step below gets it, as an input.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Into the workspace, where the release step below picks them up by name.
      - uses: actions/download-artifact@v8
        with:
          name: console-tarball

      # The bytes the tarball job packed, checked before anything is published.
      - name: The tarball, checked against its checksum
        run: sha256sum -c technitium-console.tar.gz.sha256

      # Docker's floating tags only ever move forward. latest goes to the highest
      # release in the repo and X.Y to the highest of its own line, so re-running
      # an old tag (by hand or "Re-run jobs") or tagging a backport points neither
      # back in time. Prereleases are not releases here: they move neither. The
      # notes below and the image job both follow this decision.
      - name: Which floating tags this release moves
        id: floating
        shell: bash
        run: |
          # Anonymous: the repo is public and checkout kept no token. If it ever
          # cannot read the tags, the guard below fails the release.
          releases="$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' \
            | { grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' || true; } | sort -V)"
          latest=false; minor=false
          if printf '%s\n' "$GITHUB_REF_NAME" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            # A release that cannot find itself among the tags has not read them.
            if ! printf '%s\n' "$releases" | grep -Fqx "$GITHUB_REF_NAME"; then
              echo "::error::$GITHUB_REF_NAME is not among the tags read from origin"; exit 1
            fi
            line="$(printf '%s\n' "$GITHUB_REF_NAME" | cut -d. -f1-2)."
            top="$(printf '%s\n' "$releases" | tail -n1)"
            top_of_line="$(printf '%s\n' "$releases" | awk -v p="$line" 'index($0, p) == 1' | tail -n1)"
            if [ "$GITHUB_REF_NAME" = "$top" ]; then latest=true; fi
            if [ "$GITHUB_REF_NAME" = "$top_of_line" ]; then minor=true; fi
            echo "$GITHUB_REF_NAME: highest release $top, highest of its line $top_of_line"
          fi
          floating=""
          if [ "$minor" = true ]; then floating="$(printf '%s\n' "${GITHUB_REF_NAME#v}" | cut -d. -f1-2)"; fi
          if [ "$latest" = true ]; then floating="$floating latest"; fi
          echo "latest=$latest X.Y=$minor -> floating tags: ${floating:-none}"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "floating=$floating" >> "$GITHUB_OUTPUT"

      # The release page is what people read, so it carries this version's own
      # section of CHANGELOG.md. A tag with no section there fails here instead of
      # publishing a release that says nothing.
      - name: Release notes
        id: notes
        env:
          LATEST: ${{ steps.floating.outputs.latest }}
        run: |
          tag="${GITHUB_REF_NAME}"
          awk -v head="## ${tag} " 'index($0, head) == 1 { on = 1; next } on && /^## v/ { exit } on' CHANGELOG.md \
            | sed '/^---$/d' > section.md
          # Release pages keep every newline, so the wrapped paragraphs of
          # CHANGELOG.md are joined back into one line each.
          python3 - <<'PY'
          out = []
          for line in open('section.md').read().split('\n'):
              cont = line.startswith('  ') and not line.lstrip().startswith(('- ', '|', '#'))
              plain = line and not line.startswith(('- ', '#', '|', '```')) and not line.startswith('  ')
              if out and out[-1] and not out[-1].startswith(('#', '|')) and (cont or plain):
                  out[-1] += ' ' + line.strip()
              else:
                  out.append(line)
          open('notes.md', 'w').write('\n'.join(out))
          PY
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for ${tag}"; exit 1; }
          printf '\n**Install or update:** run the one-line installer from the [README](https://github.com/byGarcia/technitium-console#installing) again. Which console goes with which server: [CHANGELOG](https://github.com/byGarcia/technitium-console/blob/main/CHANGELOG.md#which-version-for-which-server).\n' >> notes.md
          # The image job below publishes this same release for Docker. Pulling
          # only brings it when it is the one latest points at.
          # shellcheck disable=SC2016 # the backticks are Markdown, not a command
          if [ "$LATEST" = true ]; then
            printf '\n**On Docker:** `docker compose pull technitium-console && docker compose up -d technitium-console`, or pin `ghcr.io/bygarcia/technitium-console:%s`. See [Docker](https://github.com/byGarcia/technitium-console#docker).\n' "${tag#v}"
          else
            printf '\n**On Docker:** pin `ghcr.io/bygarcia/technitium-console:%s`. See [Docker](https://github.com/byGarcia/technitium-console#docker).\n' "${tag#v}"
          fi >> notes.md
          # The title is the tag and the section's opening bold sentence.
          lead="$(grep -m1 -o '^\*\*[^*]*\*\*' notes.md | sed 's/^\*\*//; s/\*\*$//; s/\.$//')"
          echo "title=${tag}${lead:+ — ${lead}}" >> "$GITHUB_OUTPUT"
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          files: |
            technitium-console.tar.gz
            technitium-console.tar.gz.sha256
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          generate_release_notes: true

  # The init image for Docker (README, «Docker»), from the tarball the job
  # above has just published: X.Y.Z is pushed and checked in every platform
  # (contract D4), and only then do X.Y and latest move, as the release job
  # decided. The steps live in .github/actions/init-image, shared with the
  # develop image. GITHUB_TOKEN is the only credential. A package's first
  # publication is private: it is made public by hand, once.
  image:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Two runs of one tag never push over each other.
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    # bash -eo pipefail: a failing command in a pipe fails the step.
    defaults:
      run:
        shell: bash
    steps:
      # For install.sh, docker/Dockerfile and the image action; no npm here.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The bytes people download, not a second build of them.
      - name: The release's own tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release" \
            --pattern technitium-console.tar.gz --pattern technitium-console.tar.gz.sha256

      # vX.Y.Z is pushed as X.Y.Z alone; a prerelease as its own version only.
      - uses: ./.github/actions/init-image
        with:
          image: ghcr.io/bygarcia/technitium-console
          tarball-dir: ${{ runner.temp }}/release
          tags: type=semver,pattern={{version}}
          floating: ${{ needs.release.outputs.floating }}
